<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro App</title>
    
    <!-- Meta PWA / Mobile / iOS -->
    <meta name="theme-color" content="#e74c3c">
    <meta name="description" content="A simple Pomodoro App with relaxing backgrounds and music.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pomodoro">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="background-layer"></div>
    
    <div class="container">
        <h1>Pomodoro App</h1>
        <h2 id="timer-title">Work Timer</h2>
        
        <div id="timer">25:00</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
            <button id="modeBtn">Switch Mode</button>
        </div>

        <div class="tasks-section">
            <div class="tasks-header">
                <h2>Tasks</h2>
                <button id="clearAllBtn" class="clear-all-btn" title="Clear all tasks">x</button>
            </div>

            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Add a task...">
                <button id="addTaskBtn">Add</button>
            </div>

            <ul id="taskList">

            </ul>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
